aid: lanch
name: Lanch
description: 'LANCH GmbH is a Berlin-based food-tech startup that builds creator-led
  virtual restaurant brands for the delivery market. Founded by Nono Konopka and Jonas
  Meynert and headquartered at Schoenhauser Allee 180 in Berlin, LANCH develops food
  brands together with German influencers, musicians and athletes, then scales them
  through franchise partners and ghost-kitchen partners operating out of existing
  restaurant kitchens. Its two flagship brands are Loco Chicken (halal-certified wings,
  filets, burgers and chicken-and-waffle creations) and Happy Slice (hand-pulled pinsa-dough
  pizza, dips and cookies), both distributed through delivery marketplaces including
  Wolt, Lieferando and Uber Eats. The company is backed by HV Capital and Felix Capital
  alongside founders of FlixBus, Gorillas, Flaschenpost, Glovo, Foodspring, Foodora,
  Honest Food and Finleap. LANCH publishes a marketing and partner-recruitment website
  only; as of this enrichment pass it exposes no public developer portal, API documentation,
  machine-readable API specification or SDK surface.'
